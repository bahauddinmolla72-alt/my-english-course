<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My English Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22;
    --paper:#FBF7EF;
    --paper-line:#E4D9C4;
    --primary:#1F5D50;
    --primary-dark:#143F37;
    --primary-soft:#DCEAE6;
    --accent:#E8A33D;
    --accent-soft:#FBEBD2;
    --success:#3E8E5A;
    --success-soft:#E3F1E7;
    --error:#C1502E;
    --error-soft:#FBEAE3;
    --muted:#7A7264;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Hind Siliguri','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .en{font-family:'Inter',sans-serif;}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:82px;
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 18px 14px;
    background:var(--primary);
    color:#fff;
    position:sticky;
    top:0;
    z-index:5;
  }
  header.topbar .back{
    background:rgba(255,255,255,.15);
    border:none;
    color:#fff;
    width:34px;height:34px;
    border-radius:9px;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  header.topbar h1{
    font-family:'Baloo 2',sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0;
    flex:1;
    line-height:1.3;
  }
  header.topbar .crumb{
    font-size:12.5px;
    opacity:.85;
    margin-top:2px;
    display:block;
    font-weight:400;
  }
  main{
    padding:18px 18px 30px;
  }
  .brandbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 18px 8px;
  }
  .brandbar .mark{
    width:38px;height:38px;
    border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    color:var(--primary-dark);
    font-size:17px;
  }
  .brandbar h1{
    font-family:'Baloo 2',sans-serif;
    font-size:20px;
    margin:0;
    color:var(--primary-dark);
  }
  .brandbar p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  .section-title{
    font-family:'Baloo 2',sans-serif;
    font-size:16px;
    color:var(--primary-dark);
    margin:22px 0 10px;
    font-weight:600;
  }
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
  }
  .home-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:8px 18px 4px;
  }
  .tile{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:16px;
    padding:16px 14px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .tile .icon{
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--primary-soft);
    color:var(--primary);
  }
  .tile.accent .icon{background:var(--accent-soft);color:var(--accent);}
  .tile h3{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    margin:0;
    color:var(--primary-dark);
  }
  .tile p{
    margin:0;
    font-size:12px;
    color:var(--muted);
  }
  .streak-card{
    margin:14px 18px 0;
    background:var(--primary-dark);
    color:#fff;
    border-radius:16px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .streak-card .num{
    font-family:'Baloo 2',sans-serif;
    font-size:26px;
    font-weight:700;
  }
  .streak-card .lbl{font-size:12px;opacity:.85;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:11px;
    font-family:'Hind Siliguri',sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  .btn.secondary{
    background:var(--accent-soft);
    color:var(--primary-dark);
  }
  .btn.outline{
    background:#fff;
    border:1.5px solid var(--paper-line);
    color:var(--ink);
  }
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .level-row{
    display:flex;
    gap:12px;
    margin-top:4px;
  }
  .level-box{
    flex:1;
    background:#fff;
    border:1.5px solid var(--paper-line);
    border-radius:16px;
    padding:18px 12px;
    text-align:center;
    cursor:pointer;
  }
  .level-box .badge{
    width:42px;height:42px;
    margin:0 auto 8px;
    border-radius:50%;
    background:var(--primary-soft);
    color:var(--primary-dark);
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .level-box h3{font-family:'Baloo 2',sans-serif;font-size:15px;margin:0 0 4px;color:var(--primary-dark);}
  .level-box p{margin:0;font-size:11.5px;color:var(--muted);}
  .progressbar{
    height:7px;
    background:var(--paper-line);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progressbar > div{
    height:100%;
    background:var(--accent);
  }
  .lesson-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:13px;
    padding:13px 14px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .lesson-item .num{
    width:32px;height:32px;
    border-radius:9px;
    background:var(--primary-soft);
    color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-family:'Baloo 2',sans-serif;
    flex-shrink:0;
  }
  .lesson-item.done .num{background:var(--success);color:#fff;}
  .lesson-item .info{flex:1;}
  .lesson-item .info h4{margin:0;font-size:14px;font-family:'Baloo 2',sans-serif;color:var(--primary-dark);}
  .lesson-item .info span{font-size:11.5px;color:var(--muted);}
  .lesson-item.locked{opacity:.55;cursor:default;}
  .part-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .part-tile{
    background:#fff;
    border:1.5px solid var(--paper-line);
    border-radius:14px;
    padding:14px 12px;
    text-align:left;
    cursor:pointer;
    position:relative;
  }
  .part-tile.done{border-color:var(--success);background:var(--success-soft);}
  .part-tile .icon{font-size:20px;margin-bottom:6px;display:block;}
  .part-tile h4{margin:0 0 3px;font-size:14px;font-family:'Baloo 2',sans-serif;color:var(--primary-dark);}
  .part-tile span{font-size:11px;color:var(--muted);}
  .check{
    position:absolute;top:10px;right:10px;
    width:18px;height:18px;border-radius:50%;
    background:var(--success);color:#fff;
    font-size:11px;
    display:flex;align-items:center;justify-content:center;
  }
  .explain-box{
    background:var(--accent-soft);
    border-radius:12px;
    padding:14px;
    font-size:13.5px;
    line-height:1.65;
    margin:22px 0 16px;
  }
  .explain-box h4{
    margin:0 0 8px;
    font-family:'Baloo 2',sans-serif;
    font-size:14.5px;
    color:var(--primary-dark);
  }
  .qcounter{
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .qprompt{
    font-size:16px;
    font-weight:600;
    margin:4px 0 16px;
    line-height:1.6;
  }
  .qprompt .en{font-size:16.5px;}
  .option{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--paper-line);
    border-radius:11px;
    padding:12px 14px;
    margin-bottom:9px;
    font-size:14.5px;
    cursor:pointer;
    font-family:'Hind Siliguri',sans-serif;
  }
  .option.selected{border-color:var(--primary);background:var(--primary-soft);}
  .option.correct{border-color:var(--success);background:var(--success-soft);}
  .option.wrong{border-color:var(--error);background:var(--error-soft);}
  input[type=text].qinput{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--paper-line);
    border-radius:11px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    margin-bottom:8px;
  }
  input[type=text].qinput.correct{border-color:var(--success);background:var(--success-soft);}
  input[type=text].qinput.wrong{border-color:var(--error);background:var(--error-soft);}
  .feedback{
    border-radius:12px;
    padding:13px 14px;
    margin-top:12px;
    font-size:13.5px;
    line-height:1.6;
  }
  .feedback.correct{background:var(--success-soft);color:var(--primary-dark);}
  .feedback.wrong{background:var(--error-soft);color:var(--primary-dark);}
  .feedback .tag{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    display:block;
    margin-bottom:5px;
  }
  .feedback.correct .tag{color:var(--success);}
  .feedback.wrong .tag{color:var(--error);}
  .word-card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:13px;
    padding:14px;
    margin-bottom:10px;
  }
  .word-card .w{font-family:'Inter',sans-serif;font-weight:600;font-size:16px;color:var(--primary-dark);}
  .word-card .m{font-size:13.5px;color:var(--muted);margin:2px 0 6px;}
  .word-card .ex{font-size:13px;font-style:italic;color:var(--ink);}
  .bottomnav{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:#fff;
    border-top:1px solid var(--paper-line);
    display:flex;
    z-index:10;
  }
  .bottomnav button{
    flex:1;
    background:none;
    border:none;
    padding:11px 4px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:11px;
    color:var(--muted);
    font-family:'Hind Siliguri',sans-serif;
    cursor:pointer;
  }
  .bottomnav button.active{color:var(--primary);}
  .bottomnav svg{width:20px;height:20px;}
  .empty-note{
    background:#fff;
    border:1.5px dashed var(--paper-line);
    border-radius:14px;
    padding:22px 16px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.7;
  }
  .empty-note .big{font-size:26px;display:block;margin-bottom:8px;}
  .weekrow{display:flex;justify-content:space-between;margin-top:10px;}
  .weekday{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:11px;color:var(--muted);
  }
  .weekday .dot{
    width:30px;height:30px;border-radius:50%;
    background:var(--paper-line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;
  }
  .weekday .dot.on{background:var(--success);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .stat-box{background:#fff;border:1px solid var(--paper-line);border-radius:13px;padding:14px;}
  .stat-box .n{font-family:'Baloo 2',sans-serif;font-size:22px;color:var(--primary-dark);}
  .stat-box .l{font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DATA ============ */

const VOCAB_L1 = [
  {w:"wake up", m:"ঘুম থেকে ওঠা", ex:"I wake up at 6 AM every day."},
  {w:"morning", m:"সকাল", ex:"I read a book in the morning."},
  {w:"breakfast", m:"সকালের নাশতা", ex:"She eats breakfast at 7 AM."},
  {w:"brush", m:"ব্রাশ করা", ex:"He brushes his teeth twice a day."},
  {w:"teeth", m:"দাঁত", ex:"Brush your teeth after breakfast."},
  {w:"bathe", m:"স্নান করা", ex:"I bathe before going to school."},
  {w:"school", m:"বিদ্যালয়", ex:"My school starts at 9 AM."},
  {w:"homework", m:"বাড়ির কাজ", ex:"I do my homework in the evening."},
  {w:"lunch", m:"দুপুরের খাবার", ex:"We eat lunch at 1 PM."},
  {w:"afternoon", m:"দুপুর / বিকাল", ex:"I play football in the afternoon."},
  {w:"evening", m:"সন্ধ্যা", ex:"We watch TV in the evening."},
  {w:"dinner", m:"রাতের খাবার", ex:"They eat dinner at 9 PM."},
  {w:"sleep", m:"ঘুমানো", ex:"I sleep at 10 PM every night."},
  {w:"tired", m:"ক্লান্ত", ex:"She is tired after school."},
  {w:"busy", m:"ব্যস্ত", ex:"My father is busy at work."},
  {w:"early", m:"তাড়াতাড়ি", ex:"I wake up early every morning."},
  {w:"late", m:"দেরি", ex:"He is never late for school."},
  {w:"walk", m:"হাঁটা", ex:"I walk to school every day."},
  {w:"bus", m:"বাস", ex:"She goes to school by bus."},
  {w:"class", m:"ক্লাস", ex:"Our class starts at 9 AM."},
  {w:"teacher", m:"শিক্ষক / শিক্ষিকা", ex:"My teacher is very kind."},
  {w:"student", m:"ছাত্র / ছাত্রী", ex:"He is a good student."},
  {w:"book", m:"বই", ex:"I read my book every night."},
  {w:"friend", m:"বন্ধু", ex:"My friend helps me with homework."},
  {w:"play", m:"খেলা", ex:"We play football after school."}
];

const VOCAB_QUIZ_L1 = [
  {type:"mcq", prompt:'"wake up" শব্দের সঠিক বাংলা অর্থ কোনটি?', options:["ঘুম থেকে ওঠা","খাওয়া","হাঁটা","পড়া"], answer:0,
    ec:'ঠিক — "wake up" মানে ঘুম থেকে ওঠা।', ew:'সঠিক উত্তর ছিল "ঘুম থেকে ওঠা"। এই শব্দটা প্রতিদিনের রুটিনে খুব বেশি ব্যবহার হয়, তাই মনে রাখা জরুরি।'},
  {type:"mcq", prompt:'"tired" শব্দের অর্থ কী?', options:["ব্যস্ত","ক্লান্ত","খুশি","রাগান্বিত"], answer:1,
    ec:'ঠিক — "tired" মানে ক্লান্ত।', ew:'সঠিক উত্তর "ক্লান্ত"। "busy" (ব্যস্ত) আর "tired" (ক্লান্ত) — এই দুটো শব্দ প্রায়ই গুলিয়ে যায়, খেয়াল রেখো।'},
  {type:"mcq", prompt:'"teacher" শব্দটির অর্থ কী?', options:["ছাত্র","শিক্ষক","বন্ধু","ডাক্তার"], answer:1,
    ec:'ঠিক — "teacher" মানে শিক্ষক।', ew:'সঠিক উত্তর "শিক্ষক"। "teacher" (যিনি শেখান) আর "student" (যে শেখে) — এই জোড়াটা একসাথে মনে রাখলে ভুল হবে না।'},
  {type:"mcq", prompt:'"early" শব্দের অর্থ কী?', options:["তাড়াতাড়ি","দেরি","ধীরে","দ্রুত"], answer:0,
    ec:'ঠিক — "early" মানে তাড়াতাড়ি/সময়ের আগে।', ew:'সঠিক উত্তর "তাড়াতাড়ি"। এর বিপরীত শব্দ হলো "late" (দেরি) — দুটো শব্দ একসাথে শিখলে সহজ হবে।'},
  {type:"mcq", prompt:'"homework" শব্দের অর্থ কী?', options:["স্কুলের কাজ","বাড়ির কাজ","খেলা","পরীক্ষা"], answer:1,
    ec:'ঠিক — "homework" মানে বাড়ির কাজ, যেটা স্কুল থেকে দেওয়া হয় কিন্তু বাড়িতে বসে করতে হয়।', ew:'সঠিক উত্তর "বাড়ির কাজ"। "home" (বাড়ি) + "work" (কাজ) — শব্দটা ভেঙে মনে রাখলে সহজ হবে।'},
  {type:"text", prompt:'ফাঁকা ঘরে সঠিক শব্দ বসাও: I ___ at 6 AM every day.', answer:["wake up","wakes up"],
    ec:'ঠিক — "wake up" ব্যবহার করে দৈনন্দিন অভ্যাস বোঝানো হয়েছে।', ew:'সঠিক উত্তর ছিল "wake up"। বাক্যটি একটি নিয়মিত অভ্যাস বোঝাচ্ছে, তাই "wake up" শব্দটাই বসবে।'},
  {type:"text", prompt:'ফাঁকা ঘরে সঠিক শব্দ বসাও: She eats ___ at 7 AM.', answer:["breakfast"],
    ec:'ঠিক — সকাল ৭টায় খাওয়া মানেই "breakfast" (সকালের নাশতা)।', ew:'সঠিক উত্তর ছিল "breakfast"। সময়টা (৭ টা, সকাল) দেখেই বোঝা যায় এটা "breakfast" হবে, "lunch" বা "dinner" নয়।'},
  {type:"text", prompt:'ফাঁকা ঘরে সঠিক শব্দ বসাও: We eat ___ at 1 PM.', answer:["lunch"],
    ec:'ঠিক — দুপুর ১টার খাবারকে "lunch" বলে।', ew:'সঠিক উত্তর ছিল "lunch"। দুপুরবেলার খাবারকে ইংরেজিতে "lunch" বলে, সকালেরটা "breakfast" আর রাতেরটা "dinner"।'},
  {type:"text", prompt:'ফাঁকা ঘরে সঠিক শব্দ বসাও: He goes to school by ___.', answer:["bus"],

/* ============ STORAGE HELPERS ============ */
function getProgress(){ return JSON.parse(localStorage.getItem("progress")||"{}"); }
function setProgress(key){
  const p = getProgress(); p[key]=true;
  localStorage.setItem("progress", JSON.stringify(p));
}
function isDone(key){ return !!getProgress()[key]; }

function getAttendance(){ return JSON.parse(localStorage.getItem("attendance")||"[]"); }
function markAttendanceToday(){
  const today = new Date().toISOString().slice(0,10);
  const log = getAttendance();
  if(!log.includes(today)){ log.push(today); localStorage.setItem("attendance", JSON.stringify(log)); }
}
function getStreak(){
  const log = getAttendance().sort();
  if(log.length===0) return 0;
  let streak=0;
  let d = new Date();
  for(;;){
    const key = d.toISOString().slice(0,10);
    if(log.includes(key)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function wordsLearnedCount(){
  let n=0;
  Object.keys(LEVELS).forEach(lv=>{
    LEVELS[lv].lessons.forEach(ls=>{
      if(isDone(lv+"-"+ls.id+"-vocab")) n+=25;
    });
  });
  return n;
}
function lessonsCompletedCount(){
  let n=0;
  Object.keys(LEVELS).forEach(lv=>{
    LEVELS[lv].lessons.forEach(ls=>{
      const allDone = PARTS.every(p=>isDone(lv+"-"+ls.id+"-"+p.key));
      if(allDone) n++;
    });
  });
  return n;
}

/* ============ ROUTER ============ */
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function go(hash){ location.hash = hash; }

function render(){
  const hash = location.hash.slice(1) || "home";
  const parts = hash.split("/");
  const app = document.getElementById("app");
  let html = "";

  if(parts[0]==="home") html = viewHome();
  else if(parts[0]==="course") html = viewCourse();
  else if(parts[0]==="level") html = viewLevel(parts[1]);
  else if(parts[0]==="lesson") html = viewLesson(parts[1], parts[2]);
  else if(parts[0]==="part") html = viewPart(parts[1], parts[2], parts[3]);
  else if(parts[0]==="week") html = viewWeek();
  else if(parts[0]==="details") html = viewDetails();
  else html = viewHome();

  app.innerHTML = html + bottomNav(parts[0]);
  attachHandlers(parts);
}

}

  const lesson = level.lessons.find(l=>String(l.id)===String(lid));
  return `
  ${topbar("Lesson "+lid+": "+lesson.title, "level/"+lv, level.name)}
  <main>
    <p style="font-size:13px;color:var(--muted);margin-top:0;">নিচের একটি অংশ বেছে অনুশীলন শুরু করো — Vocabulary দিয়ে শুরু করাই ভালো।</p>
    <div class="part-grid">
      ${PARTS.map(p=>{
        const done = isDone(lv+"-"+lid+"-"+p.key);
        return `<div class="part-tile ${done?'done':''}" onclick="go('part/${lv}/${lid}/${p.key}')">
          ${done?'<div class="check">✓</div>':""}
          <span class="icon">${p.icon}</span>
          <h4>${p.label}</h4>
          <span>${done? "সম্পূর্ণ" : "শুরু করো"}</span>
        </div>`;
      }).join("")}
    </div>
  </main>`;
}

/* Quiz runtime state */
let QUIZ = null;
function viewPart(lv, lid, partKey){
  const level = LEVELS[lv];
  const lesson = level.lessons.find(l=>String(l.id)===String(lid));
  const label = PARTS.find(p=>p.key===partKey).label;
  const crumb = `Lesson ${lid}: ${lesson.title}`;

  if(lv==="A1" && lid==="1" && partKey==="vocab"){
    return topbar("Vocabulary", `lesson/${lv}/${lid}`, crumb) + `<main>${renderVocabIntro()}</main>`;
  }
  if(lv==="A1" && lid==="1" && partKey==="grammar"){
    return topbar("Grammar", `lesson/${lv}/${lid}`, crumb) + `<main>${renderGrammarIntro()}</main>`;
  }
  // placeholder for parts not yet built
  return topbar(label, `lesson/${lv}/${lid}`, crumb) + `<main>
    <div class="empty-note">
      <span class="big">✍️</span>
      এই অংশের কনটেন্ট এখনো তৈরি হয়নি।<br>শীঘ্রই যোগ করা হবে।
    </div>
  </main>`;
}

function renderVocabIntro(){
  return `
  <div class="card">
    <div class="section-title" style="margin-top:0;">শব্দগুলো একবার দেখে নাও</div>
    ${VOCAB_L1.map(v=>`<div class="word-card">
      <div class="w en">${v.w}</div>
      <div class="m">${v.m}</div>
      <div class="ex en">"${v.ex}"</div>
    </div>`).join("")}
  </div>
  <button class="btn" onclick="startVocabQuiz()">অনুশীলনী শুরু করো →</button>
  <div id="quizArea"></div>`;
}

function startVocabQuiz(){
  QUIZ = {list: VOCAB_L1_QUIZ_COPY(), i:0, key:"A1-1-vocab", answered:false};
  document.getElementById("quizArea").innerHTML = renderQuizQuestion();
  document.getElementById("quizArea").scrollIntoView({behavior:"smooth"});
}
function VOCAB_L1_QUIZ_COPY(){ return VOCAB_QUIZ_L1.map(q=>({...q})); }

function renderGrammarIntro(){
  return `
  <div class="explain-box">
    <h4>${GRAMMAR_L1.topic}</h4>
    ${GRAMMAR_L1.explanation}
  </div>
  <button class="btn" onclick="startGrammarQuiz()">অনুশীলনী শুরু করো →</button>
  <div id="quizArea"></div>`;
}
function startGrammarQuiz(){
  QUIZ = {list: GRAMMAR_L1.questions.map(q=>({...q})), i:0, key:"A1-1-grammar", answered:false};
  document.getElementById("quizArea").innerHTML = renderQuizQuestion();
  document.getElementById("quizArea").scrollIntoView({behavior:"smooth"});
}

function renderQuizQuestion(){
  const q = QUIZ.list[QUIZ.i];
  const total = QUIZ.list.length;
  let body = "";
  if(q.type==="mcq"){
    body = q.options.map((opt,idx)=>`<button class="option" data-idx="${idx}" onclick="selectOption(${idx})">${opt}</button>`).join("");
  } else if(q.type==="text"){
    body = `<input type="text" class="qinput en" id="qInput" placeholder="উত্তর লেখো (ইংরেজিতে)">`;
  } else if(q.type==="open"){
    body = `<input type="text" class="qinput en" id="qInput" placeholder="তোমার বাক্য লেখো">`;
  }
  return `
  <div class="card">
    <div class="qcounter">প্রশ্ন ${QUIZ.i+1} / ${total}</div>
    <div class="qprompt en">${q.prompt}</div>
    ${body}
    <div id="feedbackArea"></div>
    <div class="btn-row">
      ${q.type!=="mcq" ? `<button class="btn" id="checkBtn" onclick="checkAnswer()">উত্তর দেখাও</button>`:""}
      <button class="btn outline" id="nextBtn" style="display:none;" onclick="nextQuestion()">পরবর্তী →</button>
    </div>
  </div>`;
}

function selectOption(idx){
  if(QUIZ.answered) return;
  document.querySelectorAll(".option").forEach(el=>el.classList.remove("selected"));
  document.querySelectorAll(".option")[idx].classList.add("selected");
  checkAnswer(idx);
}

function checkAnswer(mcqIdx){
  if(QUIZ.answered) return;
  const q = QUIZ.list[QUIZ.i];
  let correct = false;
  if(q.type==="mcq"){
    correct = (mcqIdx===q.answer);
    document.querySelectorAll(".option").forEach((el,idx)=>{
      if(idx===q.answer) el.classList.add("correct");
      else if(idx===mcqIdx && !correct) el.classList.add("wrong");
    });
  } else if(q.type==="text"){
    const val = document.getElementById("qInput").value.trim().toLowerCase().replace(/[.!?]+$/,"");
    correct = q.answer.some(a=>a.toLowerCase().replace(/[.!?]+$/,"")===val);
    document.getElementById("qInput").classList.add(correct?"correct":"wrong");
  } else if(q.type==="open"){
    correct = true; // always accept, encourage practice
    document.getElementById("qInput").classList.add("correct");
  }
  QUIZ.answered = true;
  const fb = document.getElementById("feedbackArea");
  fb.innerHTML = `<div class="feedback ${correct?'correct':'wrong'}">
    <span class="tag">${correct? "সঠিক! ✓" : "ভুল হয়েছে ✕"}</span>
    ${correct? q.ec : q.ew}
    ${(!correct && q.type==="text") ? `<br><br><b>সঠিক উত্তর:</b> <span class="en">${q.answer[0]}</span>` : ""}
  </div>`;
  const checkBtn = document.getElementById("checkBtn");
  if(checkBtn) checkBtn.style.display = "none";
  document.getElementById("nextBtn").style.display = "inline-flex";
}

function nextQuestion(){
  QUIZ.i++;
  QUIZ.answered = false;
  if(QUIZ.i >= QUIZ.list.length){
    setProgress(QUIZ.key);
    document.getElementById("quizArea").innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-size:34px;">🎉</div>
      <h3 style="font-family:'Baloo 2',sans-serif;color:var(--primary-dark);">অনুশীলনী সম্পূর্ণ হয়েছে!</h3>
      <p style="font-size:13.5px;color:var(--muted);">এই অংশটি এখন সম্পূর্ণ হিসেবে সংরক্ষিত হলো।</p>
      <button class="btn" onclick="history.back(); render();">লেসনে ফিরে যাও</button>
    </div>`;
    return;
  }
  document.getElementById("quizArea").innerHTML = renderQuizQuestion();
}

function viewWeek(){
  const log = getAttendance();
  const days = ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"];
  const today = new Date();
  let cells = "";
  for(let i=6;i>=0;i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const on = log.includes(key);
    cells += `<div class="weekday"><div class="dot ${on?'on':''}">${on?'✓':''}</div>${days[d.getDay()]}</div>`;
  }
  return `
  ${topbar("এই সপ্তাহ", "home", null)}
  <main>
    <div class="card">
      <div class="section-title" style="margin-top:0;">অ্যাটেন্ডেন্স</div>
      <div class="weekrow">${cells}</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">এই সপ্তাহের অগ্রগতি</div>
      <p style="font-size:13.5px;color:var(--muted);">এই সপ্তাহে সম্পূর্ণ হওয়া Lesson ও Part-এর সারাংশ শীঘ্রই এখানে যোগ হবে।</p>
    </div>
  </main>`;
}

function viewDetails(){
  const streak = getStreak();
  const words = wordsLearnedCount();
  const lessonsDone = lessonsCompletedCount();
  let totalLessons = 0;
  Object.keys(LEVELS).forEach(lv=>totalLessons += LEVELS[lv].lessons.length);
  return `
  ${topbar("সব বিস্তারিত", "home", null)}
  <main>
    <div class="stat-grid">
      <div class="stat-box"><div class="n">${words}</div><div class="l">শব্দ শেখা হয়েছে</div></div>
      <div class="stat-box"><div class="n">${lessonsDone}/${totalLessons}</div><div class="l">Lesson সম্পূর্ণ</div></div>
      <div class="stat-box"><div class="n">${streak}</div><div class="l">দিনের Streak</div></div>
      <div class="stat-box"><div class="n">${getAttendance().length}</div><div class="l">মোট উপস্থিতি</div></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-title" style="margin-top:0;">লেভেল অনুযায়ী অগ্রগতি</div>
      ${Object.keys(LEVELS).map(lv=>{
        const total = LEVELS[lv].lessons.length;
        const done = LEVELS[lv].lessons.filter(ls=>PARTS.every(p=>isDone(lv+"-"+ls.id+"-"+p.key))).length;
        return `<p style="font-size:13.5px;margin:10px 0 2px;">${LEVELS[lv].name}</p>
        <div class="progressbar"><div style="width:${Math.round(done/total*100)}%"></div></div>`;
      }).join("")}
    </div>
  </main>`;
}

function attachHandlers(){ /* inline onclick handlers used throughout */ }
</script>
